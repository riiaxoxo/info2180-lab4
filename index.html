<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superhero Search</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>

<body>
    <main class="container">
        <h1>Superhero Search</h1>

        <form id="search-form">
            <label for="query">Search by superhero name or alias:</label>
            <input type="text" id="query" name="query" placeholder="e.g. Tony Stark or Ironman">
            <button type="submit">Search</button>
        </form>

        <div id="result"></div>
    </main>

</body>

</html>
